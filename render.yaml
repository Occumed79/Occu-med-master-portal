services:
  - type: web
    name: occu-med-portal
    env: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/occu-med-portal run build
    staticPublishPath: occu-med-portal/dist/public
    envVars:
      - key: PORT
        value: 3000
      - key: BASE_PATH
        value: /
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_STORAGE_BUCKET
        value: portal-assets
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
