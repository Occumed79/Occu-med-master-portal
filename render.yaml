services:
  - type: web
    name: occu-med-portal
    env: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/occu-med-portal run build
    staticPublishPath: occu-med-portal/dist/public
    envVars:
      - key: PORT
        value: 3000
      - key: BASE_PATH
        value: /
      - key: VITE_PORTAL_API_URL
        sync: false
    redirects:
      - source: /*
        destination: /index.html
